name: External HTTPS witness

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/external-health.yml'
      - 'kuma-lite/external-targets.json'
      - 'kuma-lite/scripts/external-health-probe.mjs'
      - 'kuma-lite/src/external-observations.ts'
      - 'kuma-lite/src/github-oidc.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: external-https-witness
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kuma-lite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Check public endpoints and monitoring freshness
        run: node scripts/external-health-probe.mjs
      - name: Preserve independent observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: kuma-lite/artifacts/external-health.json
          if-no-files-found: warn
          retention-days: 7
