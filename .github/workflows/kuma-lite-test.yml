name: Kuma Lite tests

on:
  push:
    branches: [master]
    paths:
      - "kuma-lite/**"
      - ".github/workflows/kuma-lite-test.yml"
      - ".github/workflows/external-health.yml"
  pull_request:
    paths:
      - "kuma-lite/**"
      - ".github/workflows/kuma-lite-test.yml"
      - ".github/workflows/external-health.yml"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kuma-lite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: kuma-lite/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
